name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Sylvan and Lace are submodules (lib/ldd/README.md)
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The OCaml sources are listed by hand in each dune file's
      # (modules ...), and dune silently leaves out a file no list claims.
      # Needs only the runner's python3, so it runs first and fails in
      # seconds.
      - name: Check module lists agree
        run: python3 scripts/check_module_lists.py

      # No proof by computation (CLAUDE.md, hard rule 1): no
      # vm_compute, native_compute or VM cast anywhere; there is no
      # allowlist.
      - name: Check no computation as proof
        run: python3 scripts/check_no_computation.py

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The opam switch is pinned by rocq-mebi.opam.locked (~100 packages,
      # including OCaml and Rocq built from source) and does not change
      # unless that file does -- cache it so most runs skip the rebuild.
      # Both halves matter: _opam is the local switch, ~/.opam is the opam
      # root holding the repository metadata. Caching only the former left
      # the root missing, and every opam invocation then failed with
      # "Opam has not been initialised".
      - name: Cache opam switch and root
        uses: actions/cache@v4
        with:
          path: |
            _opam
            ~/.opam
          key: opam-${{ runner.os }}-${{ hashFiles('rocq-mebi.opam.locked') }}

      # opam switch create needs an initialised root, which a fresh runner
      # does not have -- without this the build failed with
      # "[ERROR] Opam has not been initialised, please run `opam init'"
      # (exit 50). --bare creates the root without a default switch, since
      # the switch we want is the local one created below. Sandboxing is
      # disabled because opam's bubblewrap sandbox does not work reliably
      # inside the nix shell, and the runner is already isolated.
      - name: Initialise opam root
        run: |
          nix develop --command bash -euc '
            if [ ! -d "$HOME/.opam" ]; then
              opam init --bare --no-setup --disable-sandboxing --yes
            fi
          '

      - name: Bootstrap opam switch
        run: |
          nix develop --command bash -euc '
            if [ ! -x _opam/bin/rocq ]; then
              opam switch create . --locked --deps-only --yes
              opam install . --locked --deps-only --yes
            fi
          '

      # Builds the plugin, its theories, test/rocq (LogTest.v,
      # CongruenceTest.v) and the examples examples/dune lists, each goal
      # decided and its certificate checked; the others are run by
      # bench/prooflog.py, by hand, under a memory cap.
      - name: dune build
        run: |
          nix develop --command bash -euc '
            eval "$(opam env --switch=$(pwd) --set-switch)"
            dune build
          '

      # lib/ldd, the binding to Sylvan, a submodule
      - name: dune exec test/ldd_tests.exe
        run: |
          nix develop --command bash -euc '
            eval "$(opam env --switch=$(pwd) --set-switch)"
            dune exec test/ldd_tests.exe
          '
