name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The opam switch is pinned by rocq-mebi.opam.locked (~100 packages,
      # including OCaml and Rocq built from source) and does not change
      # unless that file does -- cache it so most runs skip the rebuild.
      # Both halves matter: _opam is the local switch, ~/.opam is the opam
      # root holding the repository metadata. Caching only the former left
      # the root missing, and every opam invocation then failed with
      # "Opam has not been initialised".
      - name: Cache opam switch and root
        uses: actions/cache@v4
        with:
          path: |
            _opam
            ~/.opam
          key: opam-${{ runner.os }}-${{ hashFiles('rocq-mebi.opam.locked') }}

      # opam switch create needs an initialised root, which a fresh runner
      # does not have -- without this the build failed with
      # "[ERROR] Opam has not been initialised, please run `opam init'"
      # (exit 50). --bare creates the root without a default switch, since
      # the switch we want is the local one created below. Sandboxing is
      # disabled because opam's bubblewrap sandbox does not work reliably
      # inside the nix shell, and the runner is already isolated.
      - name: Initialise opam root
        run: |
          nix develop --command bash -euc '
            if [ ! -d "$HOME/.opam" ]; then
              opam init --bare --no-setup --disable-sandboxing --yes
            fi
          '

      - name: Bootstrap opam switch
        run: |
          nix develop --command bash -euc '
            if [ ! -x _opam/bin/rocq ]; then
              opam switch create . --locked --deps-only --yes
              opam install . --locked --deps-only --yes
            fi
          '

      - name: dune build
        run: |
          nix develop --command bash -euc '
            eval "$(opam env --switch=$(pwd) --set-switch)"
            dune build
          '

      - name: dune exec test/tests.exe
        run: |
          nix develop --command bash -euc '
            eval "$(opam env --switch=$(pwd) --set-switch)"
            dune exec test/tests.exe
          '

      # The saturation differential. This is the only check that catches a
      # change to Saturation silently altering which weak transitions or
      # annotations survive -- the PluginProofs.v proof suite demonstrably
      # cannot see that, since all 18 of its counts stayed identical through
      # a change that added 73 weak transitions (see ASSISTED-CHANGES.md,
      # 2026-09-28). Deterministic by construction: the dump is canonically
      # sorted and timings go to stderr, so any diff here is a real
      # behaviour change. If it is an intended one, regenerate the golden
      # file deliberately and say why in the commit message.
      - name: dune exec test/satdiff.exe (saturation differential)
        run: |
          nix develop --command bash -euc '
            eval "$(opam env --switch=$(pwd) --set-switch)"
            dune exec test/satdiff.exe -- 200 2>/dev/null \
              | diff test/satdiff.expected -
          '

      # Also exercise the make path and the examples/ subset _CoqProject
      # enables by default (the expensive PluginProofs.v proof-search suite
      # stays commented out -- see CLAUDE.md for running that by hand).
      - name: make
        run: |
          nix develop --command bash -euc '
            eval "$(opam env --switch=$(pwd) --set-switch)"
            make -j$(nproc)
          '
